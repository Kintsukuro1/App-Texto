appId: com.notionlocal.app
productName: Notion Local
copyright: Copyright © 2026

electronDist: node_modules/electron/dist

directories:
  output: dist-installer
  buildResources: public

files:
  - dist/**/*
  - dist-electron/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: drizzle
    to: drizzle
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Notion Local

asar: true

npmRebuild: false
